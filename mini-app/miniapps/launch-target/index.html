<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>启动参数接收器</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    window.__antMockPermissions = ['ui', 'storage', 'navigate'];
    window.__antMockAppId = 'com.leospring.launch_target';
    window.__antMockLaunchOptions = {
      sourceAppId: 'com.browser.mock',
      sourceAppName: '浏览器模拟器',
      params: { title: '浏览器里的模拟启动', requestId: 'mock-index' }
    };
  </script>
  <script src="ant-mock.js"></script>
</head>
<body data-page="home">
  <main>
    <header>
      <span class="badge">接收端 · 无需 miniapp 权限</span>
      <h1>启动参数接收器</h1>
      <p>从启动台打开这里，或让它在后台保活后再次打开，观察参数和事件变化。</p>
    </header>

    <section class="card current">
      <div class="title-row">
        <h2>最近一次启动</h2>
        <span id="source">直接启动</span>
      </div>
      <pre id="output">正在调用 getLaunchOptions…</pre>
    </section>

    <section class="card">
      <h2>试验动作</h2>
      <div class="actions">
        <button data-action="detail">打开本地详情页</button>
        <button data-action="history">查看接收历史</button>
        <button class="secondary" data-action="clear">清空历史</button>
      </div>
    </section>

    <section class="tip">
      入口先注册 <code>ant.miniApp.onOpen</code>，再调用
      <code>getLaunchOptions()</code>，即使页面加载很快也不会漏掉启动参数。
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
